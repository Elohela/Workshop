<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Genealogy Map</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1>🌳 Family Genealogy Map</h1>
            <div class="header-actions">
                <input type="text" id="searchInput" placeholder="Search family members..." class="search-input">
                <button id="addRootBtn" class="btn btn-primary">+ Add Root Person</button>
                <button id="exportBtn" class="btn btn-secondary">Export Data</button>
                <button id="importBtn" class="btn btn-secondary">Import Data</button>
                <input type="file" id="importFile" accept=".json" style="display: none;">
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Tree Visualization -->
        <div class="tree-container" id="treeContainer">
            <div class="tree-controls">
                <button id="zoomIn" class="control-btn" title="Zoom In">+</button>
                <button id="zoomOut" class="control-btn" title="Zoom Out">−</button>
                <button id="resetZoom" class="control-btn" title="Reset View">⟲</button>
                <button id="fitView" class="control-btn" title="Fit to View">⤢</button>
            </div>
            <svg id="familyTree"></svg>
            <div id="emptyState" class="empty-state">
                <div class="empty-state-content">
                    <h2>👪 Start Your Family Tree</h2>
                    <p>Click "Add Root Person" to begin mapping your family's genealogy.</p>
                    <p>You can add up to 5 generations and track births, deaths, and relationships.</p>
                </div>
            </div>
        </div>

        <!-- Side Panel for Editing -->
        <div class="side-panel" id="sidePanel">
            <div class="panel-header">
                <h2 id="panelTitle">Add Family Member</h2>
                <button id="closePanel" class="close-btn">×</button>
            </div>

            <div class="panel-content">
                <form id="memberForm">
                    <input type="hidden" id="memberId">

                    <div class="form-section">
                        <h3>Personal Information</h3>

                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" required>
                        </div>

                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" required>
                        </div>

                        <div class="form-group">
                            <label for="gender">Gender *</label>
                            <select id="gender" required>
                                <option value="">Select...</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="birthDate">Birth Date</label>
                                <input type="date" id="birthDate">
                            </div>

                            <div class="form-group">
                                <label for="deathDate">Death Date</label>
                                <input type="date" id="deathDate">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="photo">Photo URL</label>
                            <input type="url" id="photo" placeholder="https://example.com/photo.jpg">
                        </div>

                        <div class="form-group">
                            <label for="bio">Biography</label>
                            <textarea id="bio" rows="3" placeholder="Tell us about this person..."></textarea>
                        </div>

                        <div class="form-group">
                            <label for="notes">Additional Notes</label>
                            <textarea id="notes" rows="2" placeholder="Any additional information..."></textarea>
                        </div>
                    </div>

                    <div class="form-section" id="relationshipsSection">
                        <h3>Relationships</h3>

                        <div class="form-group">
                            <label for="mother">Mother</label>
                            <select id="mother">
                                <option value="">Select mother...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="father">Father</label>
                            <select id="father">
                                <option value="">Select father...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="spouse">Spouse</label>
                            <select id="spouse">
                                <option value="">Select spouse...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Children</label>
                            <div id="childrenList" class="children-list">
                                <!-- Children will be listed here -->
                            </div>
                            <button type="button" id="addChildBtn" class="btn btn-secondary btn-small">+ Add Child</button>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <button type="button" id="deleteBtn" class="btn btn-danger" style="display: none;">Delete</button>
                        <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Person Detail Modal -->
    <div id="personModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalName"></h2>
                <button id="closeModal" class="close-btn">×</button>
            </div>
            <div class="modal-body">
                <div class="person-photo">
                    <img id="modalPhoto" src="" alt="">
                </div>
                <div class="person-details">
                    <div class="detail-row">
                        <strong>Birth:</strong> <span id="modalBirth"></span>
                    </div>
                    <div class="detail-row">
                        <strong>Death:</strong> <span id="modalDeath"></span>
                    </div>
                    <div class="detail-row">
                        <strong>Age:</strong> <span id="modalAge"></span>
                    </div>
                    <div class="detail-row" id="modalBioRow">
                        <strong>Biography:</strong>
                        <p id="modalBio"></p>
                    </div>
                    <div class="detail-row" id="modalNotesRow">
                        <strong>Notes:</strong>
                        <p id="modalNotes"></p>
                    </div>
                </div>
                <div class="modal-actions">
                    <button id="editPersonBtn" class="btn btn-primary">Edit</button>
                    <button id="addChildToPersonBtn" class="btn btn-secondary">+ Add Child</button>
                    <button id="addSpouseBtn" class="btn btn-secondary">+ Add Spouse</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
